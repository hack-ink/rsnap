[package]
authors.workspace     = true
description.workspace = true
edition.workspace     = true
homepage.workspace    = true
license.workspace     = true
name                  = "rsnap-overlay"
readme.workspace      = true
repository.workspace  = true
version.workspace     = true

[lib]
path = "src/lib.rs"

[features]
cargo-clippy = []

[dependencies]
arboard            = { workspace = true }
color-eyre         = { workspace = true }
directories        = { workspace = true }
egui               = { workspace = true }
egui-phosphor      = { workspace = true }
egui-wgpu          = { workspace = true }
egui-winit         = { workspace = true }
font8x8            = { workspace = true }
fontdb             = { workspace = true }
fontdue            = { workspace = true }
image              = { workspace = true }
pollster           = { workspace = true }
serde              = { workspace = true }
serde_json         = { version = "1.0" }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ttf-parser         = { workspace = true }
wgpu               = { workspace = true }
winit              = { workspace = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
device_query = { workspace = true }
xcap         = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2                   = { workspace = true }
dispatch2                = { version = "0.3" }
objc                     = { workspace = true }
objc2                    = { workspace = true }
objc2-app-kit            = { workspace = true }
objc2-core-foundation    = { workspace = true }
objc2-core-graphics      = { workspace = true }
objc2-core-media         = { workspace = true }
objc2-core-video         = { workspace = true }
objc2-foundation         = { workspace = true }
objc2-screen-capture-kit = { workspace = true }
objc2-vision             = { workspace = true }
raw-window-handle        = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
harness = false
name    = "scroll_capture"
