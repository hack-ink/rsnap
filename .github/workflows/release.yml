name: Release

permissions:
  contents: read

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  MACOS_RELEASE_ASSET: rsnap-aarch64-apple-darwin.zip
  MACOS_APPCAST_ASSET: appcast.xml
  MACOS_CHECKSUM_ASSET: rsnap-aarch64-apple-darwin.zip.sha256

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sparkle_version: ${{ steps.source.outputs.sparkle_version }}
      tag_commit: ${{ steps.source.outputs.tag_commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Fetch tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch canonical main
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Validate tag, versions, and source commit
        id: source
        env:
          RELEASE_EVENT_OBJECT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          scripts/release/validate-release-source.py \
            --tag "$RELEASE_TAG" \
            --event-object "$RELEASE_EVENT_OBJECT" \
            --repository "$RELEASE_REPOSITORY" \
            --base-ref refs/remotes/origin/main \
            --github-output "$GITHUB_OUTPUT"

  build-macos:
    name: Test and package notarized macOS app
    needs: validate-release
    runs-on: macos-26
    timeout-minutes: 75
    environment:
      name: release
    env:
      RSNAP_RELEASE_COMMIT: ${{ needs.validate-release.outputs.tag_commit }}
      RSNAP_RELEASE_TAG: ${{ github.ref_name }}
      RSNAP_RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RSNAP_SPARKLE_VERSION: ${{ needs.validate-release.outputs.sparkle_version }}
    steps:
      - name: Fetch validated source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and Apple toolchain
        env:
          EXPECTED_COMMIT: ${{ needs.validate-release.outputs.tag_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$EXPECTED_COMMIT"
          test "$RUNNER_ARCH" = "ARM64"
          test "$(uname -m)" = "arm64"
          sw_vers
          swift --version
          xcodebuild -version

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          rustflags: ''

      - name: Install cargo-make
        uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # v2.82.10
        with:
          tool: cargo-make

      - name: Run release tests
        run: cargo make test-macos-release

      - name: Build, sign, notarize, staple, and package
        env:
          APPLE_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          RSNAP_RELEASE_OUTPUT_DIR: dist
          RSNAP_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.RSNAP_SPARKLE_PRIVATE_ED_KEY }}
        run: scripts/release/package-macos.sh

      - name: Upload notarized release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsnap-aarch64-apple-darwin
          path: |
            dist/${{ env.MACOS_RELEASE_ASSET }}
            dist/${{ env.MACOS_APPCAST_ASSET }}
            dist/${{ env.MACOS_CHECKSUM_ASSET }}
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Validate draft and publish release
    needs: [validate-release, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      contents: write
    env:
      RSNAP_RELEASE_COMMIT: ${{ needs.validate-release.outputs.tag_commit }}
      RSNAP_RELEASE_TAG: ${{ github.ref_name }}
      RSNAP_RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RSNAP_SPARKLE_VERSION: ${{ needs.validate-release.outputs.sparkle_version }}
    steps:
      - name: Fetch validated source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download notarized release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rsnap-aarch64-apple-darwin
          path: artifacts

      - name: Create, validate, and publish GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
          RSNAP_RELEASE_INPUT_DIR: artifacts
        run: scripts/release/publish-github-release.sh
