name: Release

permissions:
  contents: read

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  MACOS_RELEASE_ASSET: rsnap-aarch64-apple-darwin.zip
  MACOS_APPCAST_ASSET: appcast.xml
  MACOS_CHECKSUM_ASSET: rsnap-aarch64-apple-darwin.zip.sha256

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  source:
    name: Check source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sparkle_revision: ${{ steps.source.outputs.sparkle_revision }}
      sparkle_version: ${{ steps.source.outputs.sparkle_version }}
      tag_commit: ${{ steps.source.outputs.tag_commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Fetch tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch canonical main
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ''

      - name: Check tag, versions, lockfiles, and source
        id: source
        run: |
          node scripts/release/validate-release-source.ts \
            --tag "$GITHUB_REF_NAME" \
            --event-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref refs/remotes/origin/main \
            --github-output "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS release
    needs: source
    runs-on: macos-26
    timeout-minutes: 75
    env:
      RSNAP_RELEASE_COMMIT: ${{ needs.source.outputs.tag_commit }}
      RSNAP_RELEASE_TAG: ${{ github.ref_name }}
      RSNAP_RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RSNAP_SPARKLE_VERSION: ${{ needs.source.outputs.sparkle_version }}
    steps:
      - name: Fetch validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch canonical main
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          rustflags: ''

      - name: Recheck source, versions, and Apple toolchain
        run: |
          node scripts/release/validate-release-source.ts \
            --tag "$RSNAP_RELEASE_TAG" \
            --event-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref refs/remotes/origin/main \
            --expected-commit "$RSNAP_RELEASE_COMMIT" \
            --expected-version "$RSNAP_RELEASE_VERSION" \
            --expected-sparkle-version "$RSNAP_SPARKLE_VERSION"
          test "$RUNNER_ARCH" = "ARM64"
          test "$(uname -m)" = "arm64"
          sw_vers
          swift --version
          xcodebuild -version

      - name: Install cargo-make
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-make

      - name: Run release tests
        run: cargo make test-macos-release

      - name: Build, sign, and package
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          RSNAP_RELEASE_OUTPUT_DIR: dist
          RSNAP_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.RSNAP_SPARKLE_PRIVATE_ED_KEY }}
        run: scripts/release/package-macos.sh

      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsnap-aarch64-apple-darwin
          path: |
            dist/${{ env.MACOS_RELEASE_ASSET }}
            dist/${{ env.MACOS_APPCAST_ASSET }}
            dist/${{ env.MACOS_CHECKSUM_ASSET }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish release
    needs: [source, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      contents: write
    env:
      RSNAP_RELEASE_COMMIT: ${{ needs.source.outputs.tag_commit }}
      RSNAP_RELEASE_TAG: ${{ github.ref_name }}
      RSNAP_RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RSNAP_SPARKLE_VERSION: ${{ needs.source.outputs.sparkle_version }}
    steps:
      - name: Fetch validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch canonical main
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ''

      - name: Recheck source and versions
        run: |
          node scripts/release/validate-release-source.ts \
            --tag "$RSNAP_RELEASE_TAG" \
            --event-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref refs/remotes/origin/main \
            --expected-commit "$RSNAP_RELEASE_COMMIT" \
            --expected-version "$RSNAP_RELEASE_VERSION" \
            --expected-sparkle-version "$RSNAP_SPARKLE_VERSION"

      - name: Download signed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rsnap-aarch64-apple-darwin
          path: artifacts

      - name: Validate draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RSNAP_RELEASE_INPUT_DIR: artifacts
        run: node scripts/release/publish-github-release.ts
