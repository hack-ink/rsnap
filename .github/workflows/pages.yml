name: GitHub Pages

permissions:
  contents: read
  id-token: write
  pages: write

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "assets/app-icon/generated/app-icon-default-preview.png"
      - "index.html"
      - "site/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "assets/app-icon/generated/app-icon-default-preview.png"
      - "index.html"
      - "site/**"
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  package:
    name: Package static site
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Pages artifact
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/assets/app-icon/generated

          cp index.html _site/
          cp -R site _site/site
          cp \
            assets/app-icon/generated/app-icon-default-preview.png \
            _site/assets/app-icon/generated/

          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/site/main.js
          test -f _site/site/styles.css
          test -f _site/assets/app-icon/generated/app-icon-default-preview.png

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsnap-pages-preview
          path: _site
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
