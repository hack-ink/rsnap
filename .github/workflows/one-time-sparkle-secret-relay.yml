name: One-time Rsnap Sparkle secret relay

permissions:
  contents: read

on:
  push:
    branches:
      - xv/release-hardening
    paths:
      - .github/workflows/one-time-sparkle-secret-relay.yml

jobs:
  export-encrypted-secret:
    name: Encrypt existing Rsnap Sparkle key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt existing repository secret
        env:
          RSNAP_EXISTING_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$RSNAP_EXISTING_SPARKLE_PRIVATE_ED_KEY" ]]; then
            echo "error: existing Rsnap Sparkle repository secret is unavailable" >&2
            exit 1
          fi

          umask 077
          cat > recipient.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAlU2RoZioDqmonDARmhTm
          7+kz1yK+2tksEc+tnbXjUSy1Z0mwYUcJlqKmbJfFzkgIAKniiJlKsABCjiPtr+be
          VWxqKYBWyN/DQ6wSUgetKajZLl2bv42/pzdN9omPuwAzooGVrbgmhGER99zSKHLZ
          4MxAz8B+aNxVkWvSCWuEKiu77O+a64za8hf5oMilHlrTTetDnemm+mk6Og5BXU7S
          giCpAsJqcV3b/5p/9uMw6uryVRCSoWpRFql10fPFMe33YBvJCXvwyvQnZu3IeIcv
          5gJzYxKV3tn4E1djU9U1e7n1trtNcOMWliNAgMDOOcpfbbmNmn84AYZ8AN1DHPYw
          kD+rNSU/RodIAL64MhBbej9Bak8b/8bPzghZhO50LxKYIEOGFfMCtIij6O15zhzo
          vbfEpZcmJ6BcjzPEibrTtTTkcJAzd1a9nk87lamOsQU1FTEf8eS4JVcfuVg0P/hL
          Rjn4iFhfYjlBjiYE6R0tfroajqLfJ5h6VVL++YvOQzlVWBj3wXOGg/b5rz3XSo7M
          8jdSDasvqqMIPEEE9V6m5PI7udkAVMF+7Z6i6xvq3sHUA99fCKTGuVdndd1SmGkU
          ci4XTYNtxyMPyDi08jDyvJsErDz2Do2UFHNat2U4Gw+L6DmQMWlb0GWJ7P87Z6wi
          osqjuhyN51G1hVZjzkHKhZ0CAwEAAQ==
          -----END PUBLIC KEY-----
          PEM

          printf '%s' "$RSNAP_EXISTING_SPARKLE_PRIVATE_ED_KEY" \
            | openssl pkeyutl -encrypt \
                -pubin \
                -inkey recipient.pem \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
                -out rsnap-sparkle-key.enc
          unset RSNAP_EXISTING_SPARKLE_PRIVATE_ED_KEY
          rm recipient.pem
          test -s rsnap-sparkle-key.enc

      - name: Upload encrypted relay artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsnap-sparkle-key-relay
          path: rsnap-sparkle-key.enc
          if-no-files-found: error
          retention-days: 1
