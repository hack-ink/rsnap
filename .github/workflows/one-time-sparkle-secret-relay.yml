name: One-time Rsnap Sparkle secret relay

permissions:
  contents: read

on:
  push:
    branches:
      - xv/release-hardening
    paths:
      - .github/workflows/one-time-sparkle-secret-relay.yml

jobs:
  validate-organization-secret:
    name: Validate migrated Rsnap Sparkle key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify organization secret against the shipped public key
        env:
          RSNAP_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.RSNAP_SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$RSNAP_SPARKLE_PRIVATE_ED_KEY" ]]; then
            echo "error: migrated Rsnap Sparkle organization secret is unavailable" >&2
            exit 1
          fi
          node <<'NODE'
          const { createPrivateKey, createPublicKey } = require("node:crypto");
          const expected = "X2EaTv6mCzkYxz75Hh+ldMkKlpzNlHRg5l7Kn9ke8Ow=";
          const raw = Buffer.from(process.env.RSNAP_SPARKLE_PRIVATE_ED_KEY.trim(), "base64");
          if (raw.length !== 32) {
            throw new Error("Rsnap Sparkle private key must decode to 32 bytes");
          }
          const prefix = Buffer.from("302e020100300506032b657004220420", "hex");
          const privateKey = createPrivateKey({
            key: Buffer.concat([prefix, raw]),
            format: "der",
            type: "pkcs8",
          });
          const spki = createPublicKey(privateKey).export({ format: "der", type: "spki" });
          const actual = spki.subarray(spki.length - 32).toString("base64");
          if (actual !== expected) {
            throw new Error("Rsnap Sparkle private key does not match the shipped public key");
          }
          NODE
