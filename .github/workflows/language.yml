name: Language Checks

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
  merge_group: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@v6

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7
        with:
          cache: true
          rustflags: ''
          components: rustfmt, clippy

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Install cargo-make
        uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1
        with:
          tool: cargo-make

      - name: Install vibe-style (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(gh release view --repo hack-ink/vibe-style --json tagName --jq '.tagName')"
          TARGET="x86_64-unknown-linux-gnu"
          ASSET="vibe-style-${TARGET}-${VERSION}.tgz"

          gh release download "${VERSION}" \
            --repo hack-ink/vibe-style \
            --pattern "${ASSET}" \
            --dir .
          tar -xzf "${ASSET}"

          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "vibe-style-${TARGET}-${VERSION}/vstyle" "$HOME/.cargo/bin/vstyle"
          install -m 0755 "vibe-style-${TARGET}-${VERSION}/cargo-vstyle" "$HOME/.cargo/bin/cargo-vstyle"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install nextest
        uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1
        with:
          tool: nextest

      - name: Run Rust lint
        run: cargo make lint-rust

      - name: Run vibe-style lint
        run: cargo make lint-vstyle

      - name: Run Rust format checks
        run: cargo make fmt-rust-check

      - name: Run tests
        run: cargo make test-rust

  swift:
    name: Swift checks
    runs-on: macos-26
    steps:
      - name: Fetch latest code
        uses: actions/checkout@v6

      - name: Print Apple toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7
        with:
          cache: true
          rustflags: ''

      - name: Install cargo-make
        uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1
        with:
          tool: cargo-make

      - name: Run Swift format lint
        run: cargo make lint-swift-format

      - name: Run SwiftLint and strict build
        run: |
          set -euo pipefail

          cargo make lint-swiftlint
          cargo make build-swift-strict

  toml:
    name: TOML checks
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7
        with:
          cache: true
          rustflags: ''

      - name: Install cargo-make
        uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1
        with:
          tool: cargo-make

      - name: Install taplo
        uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1
        with:
          tool: taplo

      - name: Run TOML format checks
        run: cargo make fmt-toml-check
