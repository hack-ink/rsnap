name: Language Checks

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'openwiki/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'openwiki/**'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typescript-check:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up exact npm and dependencies
        run: |
          expected_node_version="$(cat .node-version)"
          cd "$RUNNER_TEMP"
          npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
          hash -r
          test "$(node --version)" = "v$expected_node_version"
          test "$(npm --version)" = "11.16.0"
          cd "$GITHUB_WORKSPACE"
          npm ci --ignore-scripts

      - name: Check TypeScript format
        run: npm run format:check

      - name: Type-check TypeScript release tools
        run: npm run typecheck

      - name: Lint TypeScript release tools
        run: npm run lint

      - name: Test TypeScript release tools
        run: npm test

      - name: Install cargo-make
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-make

      - name: Run release workflow self-check
        run: cargo make test-release

  rust-check:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          rustflags: ''
          components: rustfmt, clippy

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Install cargo-make
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-make

      - name: Install nextest
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: nextest

      - name: Run Rust format check
        run: cargo make fmt-rust-check

      - name: Run Rust style check
        uses: hack-ink/vibe-style@567174c977a3fc09229c81aacf10bf93edc4fd70 # v0.2.3
        with:
          language: rust
          workspace: true
          args: --all-features
          version: v0.2.3

      - name: Run Rust clippy
        run: cargo make check-rust

      - name: Run Rust tests
        run: cargo make test-rust

  swift-check:
    name: Swift check
    runs-on: macos-26
    steps:
      - name: Fetch latest code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Print Apple toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          rustflags: ''

      - name: Install cargo-make
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-make

      - name: Run Swift format check
        run: cargo make fmt-swift-check

      - name: Run Swift style check
        uses: hack-ink/vibe-style@567174c977a3fc09229c81aacf10bf93edc4fd70 # v0.2.3
        with:
          language: swift
          workspace: true
          args: --all-features
          version: v0.2.3

      - name: Run SwiftLint and strict build
        run: cargo make check-swift

      - name: Run Swift tests
        run: cargo make test-swift

      - name: Test Sparkle key verification
        run: scripts/release/tests/test-verify-sparkle-key.sh

  toml-check:
    name: TOML check
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          rustflags: ''

      - name: Install cargo-make
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-make

      - name: Install taplo
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: taplo

      - name: Run TOML format check
        run: cargo make fmt-toml-check
