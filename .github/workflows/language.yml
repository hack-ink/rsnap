name: Language Checks

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust-check:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: true
          rustflags: ''
          components: rustfmt, clippy

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Install cargo-make
        uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96 # v2.77.2
        with:
          tool: cargo-make

      - name: Install nextest
        uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96 # v2.77.2
        with:
          tool: nextest

      - name: Install vibe-style
        env:
          VSTYLE_VERSION: v0.2.1
        run: |
          set -euo pipefail

          target="x86_64-unknown-linux-gnu"
          asset="vibe-style-${target}-${VSTYLE_VERSION}.tgz"
          install_dir="${RUNNER_TEMP}/vibe-style/bin"

          curl -fsSLO "https://github.com/hack-ink/vibe-style/releases/download/${VSTYLE_VERSION}/${asset}"
          tar -xzf "${asset}"

          mkdir -p "${install_dir}"
          install -m 0755 "vibe-style-${target}-${VSTYLE_VERSION}/vstyle" "${install_dir}/vstyle"
          install -m 0755 "vibe-style-${target}-${VSTYLE_VERSION}/cargo-vstyle" "${install_dir}/cargo-vstyle"
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Run Rust checks
        run: cargo make check-rust

  swift-check:
    name: Swift check
    runs-on: macos-26
    steps:
      - name: Fetch latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Print Apple toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: true
          rustflags: ''

      - name: Install cargo-make
        uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96 # v2.77.2
        with:
          tool: cargo-make

      - name: Run Swift checks
        run: cargo make check-swift

  toml-check:
    name: TOML check
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: true
          rustflags: ''

      - name: Install cargo-make
        uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96 # v2.77.2
        with:
          tool: cargo-make

      - name: Install taplo
        uses: taiki-e/install-action@3fa6878dc4ae603f73960271565a082bf196ab96 # v2.77.2
        with:
          tool: taplo

      - name: Run TOML checks
        run: cargo make check-toml
