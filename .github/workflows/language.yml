name: Language Checks

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
  merge_group: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@v6

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7
        with:
          cache: true
          rustflags: ''
          components: rustfmt, clippy

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Install cargo-make
        uses: taiki-e/install-action@7ea35f098a7369cd23488403f58be9c491a6c55f
        with:
          tool: cargo-make

      - name: Install vibe-style (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(gh release view --repo hack-ink/vibe-style --json tagName --jq '.tagName')"
          TARGET="x86_64-unknown-linux-gnu"
          ASSET="vibe-style-${TARGET}-${VERSION}.tgz"

          gh release download "${VERSION}" \
            --repo hack-ink/vibe-style \
            --pattern "${ASSET}" \
            --dir .
          tar -xzf "${ASSET}"

          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "vibe-style-${TARGET}-${VERSION}/vstyle" "$HOME/.cargo/bin/vstyle"
          install -m 0755 "vibe-style-${TARGET}-${VERSION}/cargo-vstyle" "$HOME/.cargo/bin/cargo-vstyle"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install nextest
        uses: taiki-e/install-action@7ea35f098a7369cd23488403f58be9c491a6c55f
        with:
          tool: nextest

      - name: Run Rust lint
        run: cargo make lint-rust

      - name: Run vibe-style lint
        run: cargo make lint-vstyle

      - name: Run Rust format checks
        run: cargo make fmt-rust-check

      - name: Run tests
        run: cargo make test-rust

  swift:
    name: Swift checks
    runs-on: macos-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7
        with:
          cache: true
          rustflags: ''

      - name: Install cargo-make
        uses: taiki-e/install-action@7ea35f098a7369cd23488403f58be9c491a6c55f
        with:
          tool: cargo-make

      - name: Run Swift format lint
        run: |
          set -euo pipefail

          SWIFT_FORMAT_REF="603.0.0-prerelease-2026-02-09"
          SWIFT_FORMAT_REVISION="374ca240478f740794c1e60ea1693c439ee0b317"
          SWIFT_FORMAT_DIR="$RUNNER_TEMP/swift-format"

          git init "$SWIFT_FORMAT_DIR"
          git -C "$SWIFT_FORMAT_DIR" remote add origin https://github.com/apple/swift-format.git
          git -C "$SWIFT_FORMAT_DIR" fetch --depth 1 origin "refs/tags/$SWIFT_FORMAT_REF"
          git -C "$SWIFT_FORMAT_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$SWIFT_FORMAT_DIR" rev-parse HEAD)" = "$SWIFT_FORMAT_REVISION"

          swift run --package-path "$SWIFT_FORMAT_DIR" swift-format \
            lint \
            --recursive \
            --strict \
            --parallel \
            native/macos-host/Sources \
            scripts/smoke/lib/live-hud-mouse-path.swift

      - name: Run SwiftLint and strict build
        run: |
          set -euo pipefail

          cargo make lint-swiftlint
          cargo make build-swift-strict

  toml:
    name: TOML checks
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7
        with:
          cache: true
          rustflags: ''

      - name: Install cargo-make
        uses: taiki-e/install-action@7ea35f098a7369cd23488403f58be9c491a6c55f
        with:
          tool: cargo-make

      - name: Install taplo
        uses: taiki-e/install-action@7ea35f098a7369cd23488403f58be9c491a6c55f
        with:
          tool: taplo

      - name: Run TOML format checks
        run: cargo make fmt-toml-check
