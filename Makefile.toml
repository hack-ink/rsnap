# Rust workspace tasks.

# Lint
# | task            | type      | cwd |
# | --------------- | --------- | --- |
# | lint            | composite |     |
# | lint-fix        | composite |     |
# | lint-rust       | command   |     |
# | lint-fix-rust   | extend    |     |
# | lint-vstyle     | command   |     |
# | lint-fix-vstyle | command   |     |

[tasks.lint]
workspace = false
dependencies = [
	"lint-rust",
	"lint-vstyle",
]

[tasks.lint-fix]
workspace = false
dependencies = [
	"lint-fix-rust",
	"lint-fix-vstyle",
]

[tasks.lint-rust]
workspace = false
command = "cargo"
args = [
	"clippy",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

[tasks.lint-fix-rust]
extend = "lint-rust"
args = [
	"clippy",
	"--fix",
	"--allow-dirty",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

[tasks.lint-vstyle]
workspace = false
command = "cargo"
args = [
	"vstyle",
	"curate",
	"--workspace",
	"--all-features"
]

[tasks.lint-fix-vstyle]
workspace = false
command = "cargo"
args = [
	"vstyle",
	"tune",
	"--workspace",
	"--all-features",
	"--strict",
]


# Test
# | task      | type      | cwd |
# | --------- | --------- | --- |
# | test      | composite |     |
# | test-rust | command   |     |
# | test-host-reset | composite | |
# | test-rust-host-reset | command | |
# | test-host-ffi-header | command | |
# | test-macos-native-host-stage | command | |

[tasks.test]
workspace = false
dependencies = [
	"test-rust",
]

[tasks.test-rust]
workspace = false
command = "cargo"
args = [
	"nextest",
	"run",
	"--workspace",
	"--all-targets",
	"--all-features",
]

[tasks.test-host-reset]
workspace = false
dependencies = [
	"test-rust-host-reset",
	"test-host-ffi-header",
	"test-macos-native-host",
]

[tasks.test-rust-host-reset]
workspace = false
command = "cargo"
args = [
	"test",
	"-p",
	"rsnap-capture-core",
	"-p",
	"rsnap-host-ffi",
]

[tasks.test-host-ffi-header]
workspace = false
command = "clang"
args = [
	"-std=c11",
	"-fsyntax-only",
	"-I",
	"packages/rsnap-host-ffi/include",
	"packages/rsnap-host-ffi/tests/header_smoke.c",
]

[tasks.build-host-ffi-staticlib]
workspace = false
command = "cargo"
args = [
	"build",
	"-p",
	"rsnap-host-ffi",
]

[tasks.test-macos-native-host]
workspace = false
dependencies = [
	"build-host-ffi-staticlib",
]
script = '''
swift package --package-path native/macos-host clean
RSNAP_HOST_FFI_LIB_DIR="$PWD/target/debug" \
swift run --package-path native/macos-host RsnapHostBridgeProbe
'''

[tasks.test-macos-native-host-stage]
workspace = false
script = '''
RSNAP_NATIVE_HOST_SKIP_SIGN=1 ./scripts/build_and_run.sh stage
COMMON_ROOT="$(cd "$(git rev-parse --git-common-dir)/.." && pwd)"
APP_PATH="$COMMON_ROOT/.native-host-dist/rsnap.app"
test -x "$APP_PATH/Contents/MacOS/RsnapNativeHost"
test -f "$APP_PATH/Contents/Info.plist"
test -f "$APP_PATH/Contents/Resources/AppIcon.icns"
plutil -extract CFBundleIdentifier raw "$APP_PATH/Contents/Info.plist" | grep -qx 'ink.hack.rsnap'
plutil -extract LSUIElement raw "$APP_PATH/Contents/Info.plist" | grep -qx 'true'
'''


# Format
# | task           | type      | cwd |
# | -------------- | --------- | --- |
# | fmt            | composite |     |
# | fmt-check      | composite |     |
# | fmt-rust       | command   |     |
# | fmt-rust-check | extend    |     |
# | fmt-toml       | command   |     |
# | fmt-toml-check | extend    |     |

[tasks.fmt]
workspace = false
dependencies = [
	"fmt-rust",
	"fmt-toml",
]

[tasks.fmt-check]
workspace = false
dependencies = [
	"fmt-rust-check",
	"fmt-toml-check",
]

[tasks.fmt-rust]
workspace = false
script = "cargo +nightly fmt --all"

[tasks.fmt-rust-check]
extend = "fmt-rust"
script = "cargo +nightly fmt --all -- --check"

[tasks.fmt-toml]
workspace = false
command = "taplo"
args = [
	"fmt",
]

[tasks.fmt-toml-check]
extend = "fmt-toml"
args = [
	"fmt",
	"--check",
]


# Meta
# | task   | type      | cwd |
# | ------ | --------- | --- |
# | checks | composite |     |

[tasks.checks]
workspace = false
dependencies = [
	"lint",
	"test",
	"fmt-check",
]
