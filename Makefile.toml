# Rsnap workspace tasks.

# Check
# | task               | type      | cwd |
# | ------------------ | --------- | --- |
# | check              | composite |     |
# | check-rust         | command   |     |
# | check-swift        | composite |     |
# | check-swiftlint    | command   |     |
# | check-vstyle       | composite |     |
# | check-vstyle-rust  | command   |     |
# | check-vstyle-swift | command   |     |

[tasks.check]
clear = true
workspace = false
dependencies = [
	"fmt-check",
	"check-rust",
	"check-swift",
	"check-vstyle",
	"test",
]

[tasks.check-rust]
workspace = false
command = "cargo"
args = [
	"clippy",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

[tasks.check-swift]
workspace = false
dependencies = [
	"check-swiftlint",
	"build-swift-strict",
]

[tasks.check-swiftlint]
workspace = false
script = '''
SWIFT_PATH="$(xcrun --find swift)"
export TOOLCHAIN_DIR="${TOOLCHAIN_DIR:-${SWIFT_PATH%/usr/bin/swift}}"
swift package \
	--package-path native/macos-host \
	--disable-automatic-resolution \
	plugin \
	--allow-writing-to-package-directory \
	swiftlint \
	-- \
	--strict \
	--quiet \
	--no-cache
'''

[tasks.check-vstyle]
workspace = false
dependencies = [
	"check-vstyle-rust",
	"check-vstyle-swift",
]

[tasks.check-vstyle-rust]
workspace = false
command = "cargo"
args = [
	"vstyle",
	"curate",
	"--language",
	"rust",
	"--workspace",
	"--all-features",
]

[tasks.check-vstyle-swift]
workspace = false
command = "cargo"
args = [
	"vstyle",
	"curate",
	"--language",
	"swift",
	"--workspace",
	"--all-features",
]

# Format
# | task            | type      | cwd |
# | --------------- | --------- | --- |
# | fmt             | composite |     |
# | fmt-check       | composite |     |
# | fmt-rust        | command   |     |
# | fmt-rust-check  | extend    |     |
# | fmt-swift       | command   |     |
# | fmt-swift-check | command   |     |
# | fmt-toml        | command   |     |
# | fmt-toml-check  | extend    |     |

[tasks.fmt]
workspace = false
dependencies = [
	"fmt-rust",
	"fmt-swift",
	"fmt-toml",
]

[tasks.fmt-check]
workspace = false
dependencies = [
	"fmt-rust-check",
	"fmt-swift-check",
	"fmt-toml-check",
]

[tasks.fmt-rust]
workspace = false
script = "cargo +nightly fmt --all"

[tasks.fmt-rust-check]
extend = "fmt-rust"
script = "cargo +nightly fmt --all -- --check"

[tasks.fmt-swift]
workspace = false
command = "swift"
args = [
	"format",
	"format",
	"--in-place",
	"--recursive",
	"--parallel",
	"native/macos-host/Sources",
	"scripts/smoke/lib/live-hud-mouse-path.swift",
	"scripts/smoke/lib/mask-probe-capture.swift",
	"scripts/smoke/lib/pasteboard-image-info.swift",
    "scripts/smoke/lib/scroll-background-window.swift",
    "scripts/smoke/lib/scroll-background-command.swift",
    "scripts/smoke/lib/scroll-wheel-burst.swift",
	"scripts/smoke/lib/visual-background-window.swift",
]

[tasks.fmt-swift-check]
workspace = false
command = "swift"
args = [
	"format",
	"lint",
	"--recursive",
	"--strict",
	"--parallel",
	"native/macos-host/Sources",
	"scripts/smoke/lib/live-hud-mouse-path.swift",
	"scripts/smoke/lib/mask-probe-capture.swift",
	"scripts/smoke/lib/pasteboard-image-info.swift",
    "scripts/smoke/lib/scroll-background-window.swift",
    "scripts/smoke/lib/scroll-background-command.swift",
    "scripts/smoke/lib/scroll-wheel-burst.swift",
	"scripts/smoke/lib/visual-background-window.swift",
]

[tasks.fmt-toml]
workspace = false
command = "taplo"
args = [
	"fmt",
]

[tasks.fmt-toml-check]
extend = "fmt-toml"
args = [
	"fmt",
	"--check",
]

# Lint
# | task           | type      | cwd |
# | -------------- | --------- | --- |
# | lint           | composite |     |
# | lint-rust      | command   |     |
# | lint-swift     | composite |     |
# | lint-swiftlint | command   |     |
# | lint-vstyle    | composite |     |

[tasks.lint]
workspace = false
dependencies = [
	"lint-rust",
	"lint-swift",
	"lint-vstyle",
]

[tasks.lint-rust]
workspace = false
command = "cargo"
args = [
	"clippy",
	"--fix",
	"--allow-dirty",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

[tasks.lint-swift]
workspace = false
dependencies = [
	"fmt-swift",
	"lint-swiftlint",
]

[tasks.lint-swiftlint]
workspace = false
script = '''
SWIFT_PATH="$(xcrun --find swift)"
export TOOLCHAIN_DIR="${TOOLCHAIN_DIR:-${SWIFT_PATH%/usr/bin/swift}}"
swift package \
	--package-path native/macos-host \
	--disable-automatic-resolution \
	plugin \
	--allow-writing-to-package-directory \
	swiftlint \
	-- \
	--fix \
	--quiet \
	--no-cache
'''

[tasks.lint-vstyle]
workspace = false
dependencies = [
	"lint-vstyle-rust",
	"lint-vstyle-swift",
]

[tasks.lint-vstyle-rust]
workspace = false
command = "cargo"
args = [
	"vstyle",
	"tune",
	"--language",
	"rust",
	"--workspace",
	"--all-features",
	"--strict",
]

[tasks.lint-vstyle-swift]
workspace = false
command = "cargo"
args = [
	"vstyle",
	"tune",
	"--language",
	"swift",
	"--workspace",
	"--all-features",
	"--strict",
]

# Test
# | task                         | type      | cwd |
# | ---------------------------- | --------- | --- |
# | test                         | composite |     |
# | test-rust                    | command   |     |
# | test-swift                   | composite |     |
# | test-host-reset              | composite |     |
# | test-rust-host-reset         | command   |     |
# | test-host-ffi-header         | command   |     |
# | test-macos-native-host       | command   |     |
# | test-macos-native-host-stage | command   |     |

[tasks.test]
clear = true
workspace = false
dependencies = [
	"test-rust",
	"test-swift",
]

[tasks.test-rust]
workspace = false
command = "cargo"
args = [
	"nextest",
	"run",
	"--workspace",
	"--all-targets",
	"--all-features",
]

[tasks.test-swift]
workspace = false
dependencies = [
	"test-macos-native-host",
]

[tasks.test-host-reset]
workspace = false
dependencies = [
	"test-rust-host-reset",
	"test-host-ffi-header",
	"test-macos-native-host",
]

[tasks.test-rust-host-reset]
workspace = false
command = "cargo"
args = [
	"test",
	"-p",
	"rsnap-capture-core",
	"-p",
	"rsnap-host-ffi",
]

[tasks.test-host-ffi-header]
workspace = false
command = "clang"
args = [
	"-std=c11",
	"-fsyntax-only",
	"-I",
	"packages/rsnap-host-ffi/include",
	"packages/rsnap-host-ffi/tests/header_smoke.c",
]

[tasks.test-macos-native-host]
workspace = false
dependencies = [
	"build-host-ffi-staticlib",
]
script = '''
swift package --package-path native/macos-host clean
RSNAP_HOST_FFI_LIB_DIR="$PWD/target/debug" \
swift run --package-path native/macos-host RsnapHostBridgeProbe
RSNAP_HOST_FFI_LIB_DIR="$PWD/target/debug" \
swift run --package-path native/macos-host RsnapNativeHostKitProbe
'''

[tasks.test-macos-native-host-stage]
workspace = false
script = '''
./scripts/build_and_run.sh stage
COMMON_ROOT="$(cd "$(git rev-parse --git-common-dir)/.." && pwd)"
STAGE_DIR="${RSNAP_NATIVE_HOST_STAGE_DIR:-$COMMON_ROOT/target/rsnap-native-host}"
APP_PATH="$STAGE_DIR/Rsnap.app"
ACTUAL_APP_BUNDLE="$(find "$STAGE_DIR" -maxdepth 1 -type d -iname 'Rsnap.app' -print -quit)"
test -n "$ACTUAL_APP_BUNDLE"
test "$(basename "$ACTUAL_APP_BUNDLE")" = 'Rsnap.app'
codesign --verify --deep --strict "$APP_PATH"
codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -q '^TeamIdentifier='
test -x "$APP_PATH/Contents/MacOS/RsnapNativeHost"
test -f "$APP_PATH/Contents/Info.plist"
test -f "$APP_PATH/Contents/Resources/AppIcon.icns"
test -d "$APP_PATH/Contents/Frameworks/Sparkle.framework"
otool -L "$APP_PATH/Contents/MacOS/RsnapNativeHost" | grep -q '@rpath/Sparkle.framework'
otool -l "$APP_PATH/Contents/MacOS/RsnapNativeHost" | grep -q '@executable_path/../Frameworks'
if otool -l "$APP_PATH/Contents/MacOS/RsnapNativeHost" \
  | awk '$1 == "cmd" && $2 == "LC_RPATH" { in_rpath = 1; next } in_rpath && $1 == "path" { sub(/^[[:space:]]*path /, ""); sub(/[[:space:]]+\(offset [0-9]+\)$/, ""); print; in_rpath = 0 }' \
  | grep -E '^(/Applications/.*\.app/Contents/Developer/Toolchains/.*/usr/lib/swift[^/]*/macosx|/Library/Developer/CommandLineTools/usr/lib/swift[^/]*/macosx|/Users/.*/Applications/.*\.app/Contents/Developer/Toolchains/.*/usr/lib/swift[^/]*/macosx)$'; then
  echo "RsnapNativeHost must not ship local Swift toolchain rpaths" >&2
  exit 1
fi
plutil -extract CFBundleName raw "$APP_PATH/Contents/Info.plist" | grep -qx 'Rsnap'
plutil -extract CFBundleDisplayName raw "$APP_PATH/Contents/Info.plist" | grep -qx 'Rsnap'
plutil -extract CFBundleIdentifier raw "$APP_PATH/Contents/Info.plist" | grep -qx 'ink.hack.rsnap'
plutil -extract SUFeedURL raw "$APP_PATH/Contents/Info.plist" \
  | grep -qx 'https://github.com/hack-ink/rsnap/releases/latest/download/appcast.xml'
plutil -extract SUPublicEDKey raw "$APP_PATH/Contents/Info.plist" \
  | grep -qx 'X2EaTv6mCzkYxz75Hh+ldMkKlpzNlHRg5l7Kn9ke8Ow='
plutil -extract SUEnableAutomaticChecks raw "$APP_PATH/Contents/Info.plist" | grep -qx 'true'
plutil -extract SUAutomaticallyUpdate raw "$APP_PATH/Contents/Info.plist" | grep -qx 'true'
plutil -extract SUScheduledCheckInterval raw "$APP_PATH/Contents/Info.plist" | grep -qx '86400'
if plutil -extract LSUIElement raw "$APP_PATH/Contents/Info.plist" >/dev/null 2>&1; then
  echo "LSUIElement must stay unset so Settings is a normal foreground window" >&2
  exit 1
fi
'''

# Build
# | task                     | type    | cwd |
# | ------------------------ | ------- | --- |
# | build-host-ffi-staticlib | command |     |
# | build-swift-strict       | command |     |

[tasks.build-host-ffi-staticlib]
workspace = false
command = "cargo"
args = [
	"build",
	"-p",
	"rsnap-host-ffi",
]

[tasks.build-swift-strict]
workspace = false
dependencies = [
	"build-host-ffi-staticlib",
]
script = '''
RSNAP_HOST_FFI_LIB_DIR="$PWD/target/debug" \
swift build --package-path native/macos-host \
	--explicit-target-dependency-import-check error \
	-Xswiftc -warnings-as-errors \
	-Xswiftc -strict-concurrency=complete
'''

# Meta
# | task   | type      | cwd |
# | ------ | --------- | --- |
# | checks | composite |     |

[tasks.checks]
workspace = false
dependencies = [
	"check",
]
