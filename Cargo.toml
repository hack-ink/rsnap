[workspace]
members  = ["apps/*", "packages/*"]
resolver = "3"

[workspace.package]
authors     = ["Xavier Lau <x@acg.box>"]
description = "Rsnap macOS-first screenshot utility scaffolding"
edition     = "2024"
homepage    = "https://hack.ink/rsnap"
license     = "GPL-3.0"
readme      = "README.md"
repository  = "https://github.com/acgxv/rsnap"
version     = "0.3.0"

[workspace.dependencies]
arboard                  = { version = "3.6" }
block2                   = { version = "0.6" }
color-eyre               = { version = "0.6" }
criterion                = { version = "0.8", features = ["html_reports"] }
directories              = { version = "6.0" }
dispatch2                = { version = "0.3" }
fast_image_resize        = { version = "6.0" }
font8x8                  = { version = "0.3" }
fontdb                   = { version = "0.23" }
fontdue                  = { version = "0.9" }
image                    = { version = "0.25", default-features = false, features = ["png"] }
objc2                    = { version = "0.6" }
objc2-core-foundation    = { version = "0.3" }
objc2-core-graphics      = { version = "0.3" }
objc2-core-media         = { version = "0.3" }
objc2-core-video         = { version = "0.3" }
objc2-foundation         = { version = "0.3" }
objc2-screen-capture-kit = { version = "0.3" }
png                      = { version = "0.18" }
serde                    = { version = "1.0", features = ["derive"] }
thiserror                = { version = "2.0" }
toml                     = { version = "1.1" }
tracing                  = { version = "0.1" }
tracing-appender         = { version = "0.2" }
tracing-subscriber       = { version = "0.3", features = ["env-filter"] }
ttf-parser               = { version = "0.25" }

rsnap-capture-core = { version = "0.3.0", path = "packages/rsnap-capture-core" }
rsnap-host-ffi     = { version = "0.3.0", path = "packages/rsnap-host-ffi" }

[profile.final-release]
inherits = "release"
lto      = true
